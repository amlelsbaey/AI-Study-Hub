{% extends 'auth_base.html' %}

{% block title %}Invalid Link | AI Study Hub{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-brand">
        <a href="{% url 'home' %}">
            <div class="auth-logo">✦</div>
            <div><strong>AI Study</strong><span>Hub</span></div>
        </a>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <h1>Invalid verification link</h1>
            <p>This verification link is invalid or has expired. Please register again or contact support.</p>
        </div>
        <div class="auth-footer">
            <a href="{% url 'register' %}">Create a new account</a>
            &nbsp;·&nbsp;
            <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
