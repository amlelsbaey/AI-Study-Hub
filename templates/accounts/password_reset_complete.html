{% extends 'auth_base.html' %}

{% block title %}Password Updated | AI Study Hub{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-brand">
        <a href="{% url 'home' %}">
            <div class="auth-logo">✦</div>
            <div><strong>AI Study</strong><span>Hub</span></div>
        </a>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <h1>Password updated</h1>
            <p>Your password has been set successfully. You can now log in with your new password.</p>
        </div>
        <a href="{% url 'login' %}" class="auth-btn" style="display: flex; text-decoration: none; justify-content: center;">
            Log in
            <span>→</span>
        </a>
    </div>
</div>
{% endblock %}
